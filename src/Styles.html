<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  button, input, textarea, select { font: inherit; color: inherit; }

  /* 진단기(index.html)와 같은 시각 언어: Open Props 토큰을 시맨틱 변수로 재매핑 */
  :root {
    --bg: var(--gray-0);
    --bg-soft: var(--gray-1);
    --accent: var(--blue-7);
    --accent-hover: var(--blue-8);
    --accent-glow: var(--blue-1);
    --green: var(--green-7);
    --yellow: var(--yellow-7);
    --orange: var(--orange-7);
    --red: var(--red-7);
    --text: var(--gray-9);
    --text-muted: var(--gray-6);
    --card-bg: white;
    --card-border: var(--gray-3);
    --shadow-card: var(--shadow-2);
    --shadow-hover: var(--shadow-3);
    --radius-card: var(--radius-3);
    --radius-btn: var(--radius-3);
    --ease: var(--ease-3);
    --tabbar-h: 60px;
  }

  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    min-height: 100vh;
    padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  }
  a { color: var(--accent); text-decoration: none; }

  /* ── 상단바 ── */
  .topbar { background: var(--card-bg); border-bottom: 1px solid var(--card-border); position: sticky; top: 0; z-index: 20; }
  .topbar-inner { max-width: 1040px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
  .brand { font-weight: 700; font-size: 17px; color: var(--text); display: inline-flex; align-items: center; gap: 8px; }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
  .nav-desktop { display: none; gap: 4px; }
  .nav-desktop a { padding: 8px 14px; border-radius: 999px; color: var(--text-muted); font-weight: 500; font-size: 14px; }
  .nav-desktop a.active { background: var(--accent-glow); color: var(--accent); }

  /* ── 하단 탭바(모바일) ── */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    background: var(--card-bg); border-top: 1px solid var(--card-border); display: flex; z-index: 20; }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--text-muted); }
  .tabbar a .ico { font-size: 18px; line-height: 1; }
  .tabbar a.active { color: var(--accent); font-weight: 600; }

  @media (min-width: 768px) {
    .nav-desktop { display: flex; }
    .tabbar { display: none; }
    body { padding-bottom: 40px; }
  }

  /* ── 레이아웃 ── */
  .view { max-width: 1040px; margin: 0 auto; padding: 16px; }
  .loading { text-align: center; color: var(--text-muted); padding: 60px 0; }
  .page-title { font-size: 20px; font-weight: 700; margin: 4px 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .page-title small { font-size: 13px; color: var(--text-muted); font-weight: 400; }
  .grid { display: grid; gap: 12px; }
  .grid-2 { grid-template-columns: 1fr; }
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  @media (min-width: 768px) { .grid-2 { grid-template-columns: 1fr 1fr; } .grid-4 { grid-template-columns: repeat(4, 1fr); } }

  /* ── 카드 ── */
  .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 16px; }
  .card + .card, .grid + .card, .card + .grid, .grid + .grid { margin-top: 12px; }
  .card h3 { font-size: 15px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card h3 .sub { font-size: 12px; font-weight: 400; color: var(--text-muted); }
  .kpi { padding: 14px 16px; }
  .kpi .label { font-size: 12px; color: var(--text-muted); }
  .kpi .value { font-size: 24px; font-weight: 700; line-height: 1.2; margin-top: 4px; letter-spacing: -0.01em; }
  .kpi .value small { font-size: 13px; font-weight: 500; color: var(--text-muted); margin-left: 2px; }
  .kpi.warn .value { color: var(--orange); }
  .kpi.accent .value { color: var(--accent); }

  /* ── 배너 ── */
  .banner { max-width: 1040px; margin: 12px auto 0; padding: 10px 16px; border-radius: var(--radius-card); font-size: 13px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .banner.warn { background: var(--yellow-1); border: 1px solid var(--yellow-4); color: var(--yellow-9); }
  .banner.info { background: var(--accent-glow); border: 1px solid var(--blue-3); color: var(--blue-9); }
  @media (max-width: 767px) { .banner { margin: 12px 16px 0; } }

  /* ── 버튼 ── */
  .btn { padding: 10px 16px; border-radius: var(--radius-btn); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; border: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: var(--shadow-3); }
  .btn-primary:disabled, .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-secondary { background: rgba(0,0,0,0.03); color: var(--text-muted); border: 1px solid var(--card-border); }
  .btn-secondary:hover { background: rgba(0,0,0,0.06); }
  .btn-danger { background: var(--red-1); color: var(--red-8); border: 1px solid var(--red-3); }
  .btn-sm { padding: 6px 10px; font-size: 13px; }
  .btn-block { width: 100%; justify-content: center; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── 뱃지·칩 ── */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--bg-soft); color: var(--text-muted); border: 1px solid var(--card-border); white-space: nowrap; }
  .badge.stage-잠재 { background: var(--gray-1); }
  .badge.stage-견적발송 { background: var(--blue-1); color: var(--blue-8); border-color: var(--blue-3); }
  .badge.stage-협상 { background: var(--violet-1); color: var(--violet-8); border-color: var(--violet-3); }
  .badge.stage-거래중 { background: var(--green-1); color: var(--green-8); border-color: var(--green-3); }
  .badge.stage-휴면 { background: var(--yellow-1); color: var(--yellow-9); border-color: var(--yellow-3); }
  .badge.stage-이탈 { background: var(--red-1); color: var(--red-8); border-color: var(--red-3); }
  .badge.intent-상 { background: var(--orange-1); color: var(--orange-8); border-color: var(--orange-3); }
  .badge.alert { background: var(--red-1); color: var(--red-8); border-color: var(--red-3); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .chip { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--card-border); background: var(--card-bg); font-size: 13px; cursor: pointer; color: var(--text-muted); }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── 목록 ── */
  .list { display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; gap: 10px; padding: 12px 4px; border-bottom: 1px solid var(--card-border); cursor: pointer; }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--bg-soft); }
  .row .main { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .row .meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .side { text-align: right; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .row .side b { display: block; font-size: 14px; color: var(--text); }
  .row .side b.hot { color: var(--red); }
  .empty { color: var(--text-muted); font-size: 13px; padding: 12px 0; text-align: center; }

  /* ── 아코디언(오늘 챙길 고객) ── */
  .acc { border: 1px solid var(--card-border); border-radius: var(--radius-card); margin-bottom: 8px; overflow: hidden; background: var(--card-bg); }
  .acc summary { padding: 12px 14px; cursor: pointer; font-weight: 600; display: flex; justify-content: space-between; align-items: center; list-style: none; }
  .acc summary::-webkit-details-marker { display: none; }
  .acc summary .count { background: var(--red-1); color: var(--red-8); border-radius: 999px; padding: 1px 10px; font-size: 12px; }
  .acc .item { padding: 10px 14px; border-top: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
  .acc .item .msg { flex: 1; }
  .acc .item .who { font-weight: 600; }

  /* ── 폼 ── */
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
  .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--card-border); border-radius: var(--radius-btn); background: var(--card-bg); font-size: 15px; }
  .field textarea { min-height: 70px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-glow); }
  .field .hint { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .form-grid { display: grid; gap: 0 12px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .form-grid { grid-template-columns: 1fr 1fr; } .form-grid .full { grid-column: 1 / -1; } }
  .seg { display: flex; background: var(--bg-soft); border-radius: 999px; padding: 4px; margin-bottom: 16px; }
  .seg button { flex: 1; padding: 8px; border-radius: 999px; border: none; background: transparent; color: var(--text-muted); font-weight: 600; cursor: pointer; }
  .seg button.active { background: var(--card-bg); color: var(--accent); box-shadow: var(--shadow-card); }
  .search { width: 100%; padding: 11px 14px; border: 1px solid var(--card-border); border-radius: 999px; background: var(--card-bg); font-size: 15px; }

  /* ── 상세 ── */
  .kv { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; font-size: 14px; }
  .kv dt { color: var(--text-muted); font-size: 12px; padding-top: 2px; }
  .kv dd { word-break: break-word; }
  .timeline { list-style: none; }
  .timeline li { position: relative; padding: 0 0 14px 18px; border-left: 2px solid var(--card-border); margin-left: 6px; }
  .timeline li::before { content: ''; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .timeline .date { font-size: 12px; color: var(--text-muted); }
  .timeline .body { font-size: 14px; }
  .timeline .next { font-size: 12px; color: var(--orange-8); margin-top: 2px; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tbl th, table.tbl td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--card-border); vertical-align: top; }
  table.tbl th { font-size: 11px; color: var(--text-muted); font-weight: 600; }
  table.tbl td.num { text-align: right; white-space: nowrap; }
  .quote { background: var(--bg-soft); border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 0 var(--radius-card) var(--radius-card) 0; font-size: 14px; margin-top: 8px; }
  .quote .q { font-size: 11px; color: var(--text-muted); font-weight: 600; }

  /* ── 차트 ── */
  .chart { width: 100%; height: auto; display: block; }
  .chart text { font-family: inherit; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }

  /* ── 설정 ── */
  .status-line { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gray-4); }
  .dot.on { background: var(--green); } .dot.off { background: var(--red); }
  code.url { font-size: 12px; background: var(--bg-soft); padding: 4px 8px; border-radius: 6px; word-break: break-all; display: block; }
  pre.preview { white-space: pre-wrap; font-family: inherit; font-size: 13px; background: var(--bg-soft); padding: 12px; border-radius: var(--radius-card); }

  /* ── 토스트 ── */
  .toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 16px); transform: translateX(-50%); background: var(--gray-9); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 50; box-shadow: var(--shadow-3); max-width: 90vw; }
  .toast.error { background: var(--red-8); }
  @media (min-width: 768px) { .toast { bottom: 24px; } }
</style>
